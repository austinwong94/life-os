      - name: Check temporary workout rest timing and record preservation in WebKit
        if: matrix.group == 'health'
        run: npm run test:workout-rest
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/workout-rest-webkit
      - name: Check read-only exercise history and original record preservation in Chromium
        if: matrix.group == 'health'
        run: npm run test:exercise-history
        env:
          TEST_OUTPUT: test-results/exercise-history-chromium
      - name: Check read-only exercise history and original record preservation in WebKit
        if: matrix.group == 'health'
        run: npm run test:exercise-history
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/exercise-history-webkit
      - run: npm run test:responsive
        if: matrix.group == 'daily'
