        run: npm run test:refinements
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/refinements-webkit
      - run: npm run test:design
        if: matrix.group == 'daily'
        env:
          TEST_OUTPUT: test-results/design
      - run: npm run test:redesign
        if: matrix.group == 'daily'
        env:
          TEST_OUTPUT: test-results/redesign
      - name: Check record writing and navigation in WebKit
        if: matrix.group == 'daily'
        run: npm run test:redesign
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/redesign-webkit
      - run: npm run test:shell
        if: matrix.group == 'daily'
        env:
          TEST_OUTPUT: test-results/shell
      - run: npm run test:momentum
        if: matrix.group == 'daily'
        env:
          TEST_OUTPUT: test-results/momentum
      - run: npm run test:interface-polish
        if: matrix.group == 'daily'
        env:
          TEST_OUTPUT: test-results/interface-polish
      - run: npm run test:workspace-structure
        if: matrix.group == 'daily'
        env:
          TEST_OUTPUT: test-results/workspace-structure
      - name: Check workspace structure and retained writing in WebKit
        if: matrix.group == 'daily'
