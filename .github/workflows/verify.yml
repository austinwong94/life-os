name: Life OS regression tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: life-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.4
      - name: Type-check the private Calendar backend without secrets
        run: deno check --no-config --node-modules-dir=none supabase/functions/google-calendar/index.ts
      - name: Build complete public artifact
        run: npm run build
      - name: Start isolated preview
        run: LIFE_OS_SERVE_RELEASE=1 npm start > /tmp/life-os-server.log 2>&1 &
      - run: npm run test:planner-archive
        env:
          TEST_OUTPUT: test-results/planner-archive
      - name: Check planner archive persistence in WebKit
        run: npm run test:planner-archive
        env:
          TEST_BROWSER: webkit
          TEST_URL: http://127.0.0.1:5180/?liveReload=0
          TEST_OUTPUT: test-results/planner-archive-webkit
      - run: npm run test:money
        env:
          TEST_OUTPUT: test-results/money
      - name: Check money flows in WebKit
        run: npm run test:money
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/money-webkit
      - run: npm run test:browser
        env:
          TEST_OUTPUT: test-results
      - run: npm run test:sync
        env:
          TEST_OUTPUT: test-results
      - name: Check existing-account password setup
        run: node tests/password.cjs
        env:
          TEST_OUTPUT: test-results/password
      - name: Check existing-account password setup in WebKit
        run: node tests/password.cjs
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/password-webkit
      - name: Check cloud copy preservation in WebKit
        run: npm run test:sync
        env:
          TEST_BROWSER: webkit
          TEST_CASE_PATTERN: "missing|changes during|quota failure prevents|cloud readback truncation|baseline storage failure|cancelled cloud comparison|native storage quota|older tab rewriting legacy|JSONB-reordered|recovery vault|emergency downloads|automatic capacity repair"
          TEST_OUTPUT: test-results/cloud-copies-webkit
      - run: npm run test:features
        env:
          TEST_OUTPUT: test-results
      - run: npm run test:usability
        env:
          TEST_OUTPUT: test-results
      - run: npm run test:catalogue
        env:
          TEST_OUTPUT: test-results
      - run: npm run test:capture
        env:
          TEST_OUTPUT: test-results
      - run: npm run test:planner-review
        env:
          TEST_OUTPUT: test-results
      - run: npm run test:health-review
        env:
          TEST_OUTPUT: test-results
      - run: npm run test:responsive
        env:
          TEST_OUTPUT: test-results
      - name: Check WebKit phone and portrait layouts
        run: npm run test:responsive
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/webkit
      - run: npm run test:conflicts
        env:
          TEST_OUTPUT: test-results
      - run: npm run test:restore
        env:
          TEST_OUTPUT: test-results
      - run: npm run test:planning
        env:
          TEST_OUTPUT: test-results
      - run: npm run test:google-calendar
        env:
          TEST_OUTPUT: test-results/google-calendar
      - name: Check Google connection controls in WebKit
        run: npm run test:google-calendar
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/google-calendar-webkit
      - name: Check task and calendar flows in WebKit
        run: npm run test:planning
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/webkit
      - run: npm run test:coaching
        env:
          TEST_OUTPUT: test-results/coaching
      - run: npm run test:daily
        env:
          TEST_OUTPUT: test-results/daily
      - name: Check daily flows in WebKit
        run: npm run test:daily
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/daily-webkit
      - name: Check coaching flows in WebKit
        run: npm run test:coaching
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/coaching-webkit
      - run: npm run test:refinements
        env:
          TEST_OUTPUT: test-results/refinements
      - run: npm run test:task-sources
        env:
          TEST_OUTPUT: test-results/task-sources
      - run: npm run test:subtasks
        env:
          TEST_OUTPUT: test-results/subtasks
      - name: Check subtasks in WebKit
        run: npm run test:subtasks
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/subtasks-webkit
      - run: npm run test:preview-isolation
        env:
          TEST_OUTPUT: test-results/preview-isolation
      - name: Check preview isolation in WebKit
        run: npm run test:preview-isolation
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/preview-isolation-webkit
      - name: Check source-card tasks in WebKit
        run: npm run test:task-sources
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/task-sources-webkit
      - name: Check refinements in WebKit
        run: npm run test:refinements
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/refinements-webkit
      - run: npm run test:design
        env:
          TEST_OUTPUT: test-results/design
      - run: npm run test:follow-through
        env:
          TEST_OUTPUT: test-results/follow-through
      - name: Check follow-through on WebKit
        run: npm run test:follow-through
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/follow-through-webkit
      - name: Check workspace design in WebKit
        run: npm run test:design
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/design-webkit
      - uses: actions/upload-artifact@v4
        with:
          name: verified-life-os-site
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-regression-results
          path: test-results/
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: life-os-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-life-os-site
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
