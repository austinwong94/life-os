name: Life OS regression tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: life-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  property-ui-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Start isolated artifact preview
        run: LIFE_OS_SERVE_RELEASE=1 npm start > /tmp/life-os-preflight.log 2>&1 &
      - name: Check long meal selects on touch WebKit
        run: npm run test:meal-reuse
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/preflight-meal-webkit
      - name: Check exercise reuse on touch WebKit
        run: npm run test:exercise-reuse
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/preflight-exercise-webkit
      - name: Check Properties workflows in Chromium
        run: npm run test:properties
        env:
          TEST_OUTPUT: test-results/preflight-properties-chromium
      - name: Check Properties workflows in WebKit
        run: npm run test:properties
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/preflight-properties-webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: properties-preflight-results
          path: test-results/
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - name: Check conservative device receipt recovery in Chromium
        run: npm run test:storage-repair
        env:
          TEST_OUTPUT: test-results/storage-repair-chromium
      - name: Check conservative device receipt recovery in WebKit
        run: npm run test:storage-repair
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/storage-repair-webkit
      - name: Measure isolated small-history save and reload in Chromium
        run: npm run test:performance
        env:
          PERF_PROFILES: small
          PERF_SAMPLES: '1'
          TEST_OUTPUT: test-results/performance-chromium
      - name: Measure isolated small-history save and reload in WebKit
        run: npm run test:performance
        env:
          TEST_BROWSER: webkit
          PERF_PROFILES: small
          PERF_SAMPLES: '1'
          TEST_OUTPUT: test-results/performance-webkit
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.4
      - name: Type-check the private Calendar backend without secrets
        run: deno check --no-config --node-modules-dir=none supabase/functions/google-calendar/index.ts
      - name: Type-check protected property calendar imports without secrets
        run: deno check --no-config --node-modules-dir=none supabase/functions/property-ical-import/index.ts supabase/functions/property-ical-cron-sync/index.ts
      - name: Verify inactive incremental storage prototype in Chromium
        run: npm run test:delta-store
        env:
          TEST_OUTPUT: test-results/experimental-delta-chromium
      - name: Verify inactive incremental storage prototype in WebKit
        run: npm run test:delta-store
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/experimental-delta-webkit
      - name: Verify inactive ordered capture and retry in Chromium
        run: npm run test:capture-queue
        env:
          TEST_OUTPUT: test-results/capture-queue-chromium
      - name: Verify inactive ordered capture and retry in WebKit
        run: npm run test:capture-queue
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/capture-queue-webkit
      - name: Verify inactive board reconciliation in Chromium
        run: npm run test:board-reconcile
        env:
          TEST_OUTPUT: test-results/board-reconcile-chromium
      - name: Verify inactive board reconciliation in WebKit
        run: npm run test:board-reconcile
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/board-reconcile-webkit
      - name: Build complete public artifact
        run: npm run build
      - name: Check cached and incomplete startup in Chromium
        run: npm run test:release-startup
        env:
          TEST_OUTPUT: test-results/release-startup
      - name: Check cached and incomplete startup in WebKit
        run: npm run test:release-startup
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/release-startup-webkit
      - name: Start isolated preview
        run: LIFE_OS_SERVE_RELEASE=1 npm start > /tmp/life-os-server.log 2>&1 &
      - name: Check whole-card archive rollback and Undo in Chromium
        run: npm run test:card-archive
        env:
          TEST_OUTPUT: test-results/card-archive-chromium
      - name: Check focus and layout save safeguards in Chromium
        run: npm run test:board-tools
        env:
          TEST_OUTPUT: test-results/board-tools-chromium
      - name: Check focus and layout save safeguards in WebKit
        run: npm run test:board-tools
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/board-tools-webkit
      - name: Check whole-card archive rollback and Undo in WebKit
        run: npm run test:card-archive
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/card-archive-webkit
      - name: Repeat three-tab coherent HTTP startup in WebKit
        run: npm run test:startup-repeat
        env:
          TEST_BROWSER: webkit
          TEST_URL: http://127.0.0.1:5180/?liveReload=0
          TEST_OUTPUT: test-results/startup-repeat-webkit
      - name: Check card moves and permanent deletion in Chromium
        run: npm run test:card-transfer
        env:
          TEST_OUTPUT: test-results/card-transfer-chromium
      - name: Check card moves and permanent deletion in WebKit
        run: npm run test:card-transfer
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/card-transfer-webkit
      - run: npm run test:planner-archive
        env:
          TEST_OUTPUT: test-results/planner-archive
      - name: Check whole-board deletion safeguards in Chromium
        run: npm run test:board-deletion
        env:
          TEST_OUTPUT: test-results/board-deletion-chromium
      - name: Check whole-board deletion safeguards in WebKit
        run: npm run test:board-deletion
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/board-deletion-webkit
      - name: Check planner archive persistence in WebKit
        run: npm run test:planner-archive
        env:
          TEST_BROWSER: webkit
          TEST_URL: http://127.0.0.1:5180/?liveReload=0
          TEST_OUTPUT: test-results/planner-archive-webkit
      - name: Check board creation and settings safeguards in Chromium
        run: npm run test:board-management
        env:
          TEST_OUTPUT: test-results/board-management-chromium
      - name: Check board creation and settings safeguards in WebKit
        run: npm run test:board-management
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/board-management-webkit
      - run: npm run test:money
        env:
          TEST_OUTPUT: test-results/money
      - name: Check board navigation and composer safeguards in Chromium
        run: npm run test:board-navigation
        env:
          TEST_OUTPUT: test-results/board-navigation-chromium
      - name: Check board navigation and composer safeguards in WebKit
        run: npm run test:board-navigation
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/board-navigation-webkit
      - name: Check money flows in WebKit
        run: npm run test:money
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/money-webkit
      - run: npm run test:browser
        env:
          TEST_OUTPUT: test-results
      - run: npm run test:sync
        env:
          TEST_OUTPUT: test-results
      - name: Check existing-account password setup
        run: node tests/password.cjs
        env:
          TEST_OUTPUT: test-results/password
      - name: Check existing-account password setup in WebKit
        run: node tests/password.cjs
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/password-webkit
      - name: Check complete cloud and device preservation in WebKit
        run: npm run test:sync
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/cloud-copies-webkit
          TEST_SAVE_TRACE: '1'
      - name: Check device checkpoint refusals and recovery in Chromium
        run: npm run test:device-concurrency
        env:
          TEST_OUTPUT: test-results/device-concurrency
      - name: Check session renewal receipts and sign-out in Chromium
        run: npm run test:session-renewal
        env:
          TEST_OUTPUT: test-results/session-renewal
      - name: Check session renewal receipts and sign-out in WebKit
        run: npm run test:session-renewal
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/session-renewal-webkit
      - name: Check device checkpoint refusals and recovery in WebKit
        run: npm run test:device-concurrency
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/device-concurrency-webkit
      - run: npm run test:features
        env:
          TEST_OUTPUT: test-results
      - name: Check readable pending-copy downloads in Chromium
        run: npm run test:readable-export
        env:
          TEST_OUTPUT: test-results/readable-export
      - name: Check readable pending-copy downloads in WebKit
        run: npm run test:readable-export
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/readable-export-webkit
      - name: Check safe updates and pinned-release coexistence in Chromium
        run: npm run test:version-compatibility
        env:
          TEST_OUTPUT: test-results/version-compatibility
      - name: Check safe updates and pinned-release coexistence in WebKit
        run: npm run test:version-compatibility
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/version-compatibility-webkit
      - name: Check interrupted cloud saves in Chromium
        run: npm run test:cloud-reconnect
        env:
          TEST_OUTPUT: test-results/cloud-reconnect
      - name: Check read-only startup cloud verification in Chromium
        run: npm run test:cloud-startup-check
        env:
          TEST_OUTPUT: test-results/cloud-startup-check-chromium
      - name: Check read-only startup cloud verification in WebKit
        run: npm run test:cloud-startup-check
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/cloud-startup-check-webkit
      - name: Check interrupted cloud saves in WebKit
        run: npm run test:cloud-reconnect
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/cloud-reconnect-webkit
      - run: npm run test:usability
        env:
          TEST_OUTPUT: test-results
      - run: npm run test:catalogue
        env:
          TEST_OUTPUT: test-results
      - run: npm run test:capture
        env:
          TEST_OUTPUT: test-results
      - run: npm run test:planner-review
        env:
          TEST_OUTPUT: test-results
      - uses: actions/upload-artifact@v4
        with:
          name: verified-core-manifest
          path: dist/release.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-core-results
          path: test-results/
  verify-features:
    name: verify-features (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [health, planning, daily]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Build complete public artifact
        run: npm run build
      - name: Start isolated preview
        run: LIFE_OS_SERVE_RELEASE=1 npm start > /tmp/life-os-server.log 2>&1 &
      - run: npm run test:health-review
        if: matrix.group == 'health'
        env:
          TEST_OUTPUT: test-results
      - name: Check health-card editing and responsive layouts in Chromium
        if: matrix.group == 'health'
        run: npm run test:health-interface
        env:
          TEST_OUTPUT: test-results/health-interface
      - name: Check isolated One Tap experiment in Chromium
        if: matrix.group == 'health'
        run: npm run test:one-tap
        env:
          TEST_OUTPUT: test-results/one-tap-chromium
      - name: Check isolated One Tap experiment in WebKit
        if: matrix.group == 'health'
        run: npm run test:one-tap
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/one-tap-webkit
      - name: Check the shared Health workspace and installation safety in Chromium
        if: matrix.group == 'health'
        run: npm run test:health-workspace
        env:
          TEST_OUTPUT: test-results/health-workspace
      - name: Check meal reuse and original nutrition preservation in Chromium
        if: matrix.group == 'health'
        run: npm run test:meal-reuse
        env:
          TEST_OUTPUT: test-results/meal-reuse
      - name: Check usual meals, timing and original weight records in Chromium
        if: matrix.group == 'health'
        run: npm run test:food-daily
        env:
          TEST_OUTPUT: test-results/food-daily-chromium
      - name: Check usual meals, timing and original weight records in WebKit
        if: matrix.group == 'health'
        run: npm run test:food-daily
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/food-daily-webkit
      - name: Check Today food and training shortcuts without modifying original records in Chromium
        if: matrix.group == 'health'
        run: npm run test:today-health
        env:
          TEST_OUTPUT: test-results/today-health-chromium
      - name: Check Today food and training shortcuts without modifying original records in WebKit
        if: matrix.group == 'health'
        run: npm run test:today-health
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/today-health-webkit
      - name: Check meal reuse and original nutrition preservation in WebKit
        if: matrix.group == 'health'
        run: npm run test:meal-reuse
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/meal-reuse-webkit
      - name: Check appearance and preserved board records in Chromium
        if: matrix.group == 'daily'
        run: npm run test:appearance
        env:
          TEST_OUTPUT: test-results/appearance
      - name: Check exercise-name reuse without copying performance in Chromium
        if: matrix.group == 'health'
        run: npm run test:exercise-reuse
        env:
          TEST_OUTPUT: test-results/exercise-reuse
      - name: Check exercise-name reuse without copying performance in WebKit
        if: matrix.group == 'health'
        run: npm run test:exercise-reuse
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/exercise-reuse-webkit
      - name: Check appearance and preserved board records in WebKit
        if: matrix.group == 'daily'
        run: npm run test:appearance
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/appearance-webkit
      - name: Check health-card editing and responsive layouts in WebKit
        if: matrix.group == 'health'
        run: npm run test:health-interface
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/health-interface-webkit
      - name: Check the shared Health workspace and installation safety in WebKit
        if: matrix.group == 'health'
        run: npm run test:health-workspace
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/health-workspace-webkit
      - name: Check individual set logging and preceding-client preservation in Chromium
        if: matrix.group == 'health'
        run: npm run test:fitness-sets
        env:
          TEST_OUTPUT: test-results/fitness-sets-chromium
      - name: Check individual set logging and preceding-client preservation in WebKit
        if: matrix.group == 'health'
        run: npm run test:fitness-sets
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/fitness-sets-webkit
      - name: Check temporary workout rest timing and record preservation in Chromium
        if: matrix.group == 'health'
        run: npm run test:workout-rest
        env:
