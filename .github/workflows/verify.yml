          name: synthetic-feature-results-${{ matrix.group }}
          path: test-results/
  verify-properties:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Build complete property regression artifact
        run: npm run build
      - name: Start isolated property regression preview
        run: LIFE_OS_SERVE_RELEASE=1 npm start > /tmp/life-os-property-regression.log 2>&1 &
      - name: Check Properties booking and payment workflows
        run: npm run test:properties
        env:
          TEST_OUTPUT: test-results/properties-chromium
      - name: Check Properties in WebKit
        run: npm run test:properties
        env:
          TEST_BROWSER: webkit
          TEST_OUTPUT: test-results/properties-webkit
      - uses: actions/upload-artifact@v4
        with:
          name: verified-property-manifest
          path: dist/release.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-property-regression-results
          path: test-results/
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, verify-features, property-ui-preflight, verify-properties]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: life-os-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-life-os-site
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: verified-core-manifest
          path: verification/core
      - uses: actions/download-artifact@v4
        with:
          name: verified-property-manifest
          path: verification/properties
      - uses: actions/download-artifact@v4
        with:
          name: verified-feature-manifest-health
          path: verification/features/health
      - uses: actions/download-artifact@v4
        with:
          name: verified-feature-manifest-planning
          path: verification/features/planning
      - uses: actions/download-artifact@v4
        with:
          name: verified-feature-manifest-daily
          path: verification/features/daily
      - name: Verify test jobs accepted identical complete release bytes
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict'),crypto=require('node:crypto');
          const core=JSON.parse(fs.readFileSync('verification/core/release.json','utf8'));
          const properties=JSON.parse(fs.readFileSync('verification/properties/release.json','utf8'));
          const site=JSON.parse(fs.readFileSync('dist/release.json','utf8'));
          assert.deepStrictEqual(site,core,'The test jobs verified different artifacts');
          assert.deepStrictEqual(site,properties,'The property test job verified a different artifact');
          for(const group of ['health','planning','daily']){
            const feature=JSON.parse(fs.readFileSync('verification/features/'+group+'/release.json','utf8'));
            assert.deepStrictEqual(site,feature,'The '+group+' feature group verified a different artifact');
          }
          assert.match(site.id,/^[a-f0-9]{16}$/);
          assert.deepStrictEqual(fs.readdirSync('dist').sort(),[...Object.keys(site.files),'release.json'].sort(),'Unexpected public artifact files');
          for(const [file,hash] of Object.entries(site.files)){
            assert.match(file,/^[a-z0-9-]+\.(html|js|css|webmanifest|png)$/);assert.match(hash,/^[a-f0-9]{64}$/);
            const actual=crypto.createHash('sha256').update(fs.readFileSync(path.join('dist',file))).digest('hex');
            assert.strictEqual(actual,hash,file+' failed its accepted fingerprint');
          }
          console.log('Core, feature and property jobs verified release '+site.id+' and every public file matches.');
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
